  if(e.target.id==='popv')return popX();if(e.target.classList.contains('ov'))return close();
  const hl=e.target.closest('a[href^="#"]');if(hl&&hl.getAttribute('href').length>1){e.preventDefault();if(editing&&hl.closest('#content'))return;const id=hl.getAttribute('href').slice(1);try{history.pushState(null,'','#'+id)}catch(x){}nav(id);return}
  const x=e.target.closest('.x');if(x){x.parentElement.remove();return}
  const pbt=e.target.closest('.pb');if(pbt){pick(1400,u=>{pbt.parentElement.style.backgroundImage=`url("${u}")`});return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;if(me&&!isEd()&&!['out','close','popx','popgo','menu','login','atab','aj','dologin','doreg','rqcp'].includes(a))return;
  if(a==='close')close();
  else if(a==='menu')document.body.classList.toggle('mo');
  else if(a==='revs'){if(editing)capture();W={on:!!S.rvOn,gm:S.gm||'',rt:S.rt||'',list:(S.revs||[]).map(r=>({...r}))};drawRevs()}
  else if(a==='rdel'){syncR();W.list.splice(i,1);drawRevs()}
  else if(a==='radd'){syncR();W.list.push({n:'Nama Pelanggan',s:5,t:'Tulis ulasan pelanggan di sini.'});drawRevs()}
  else if(a==='rsave'){syncR();S.rvOn=W.on;S.gm=W.gm;S.rt=W.rt;S.revs=W.list;await commit()}
  else if(a==='dl'){if(editing){capture();editing=false}await persist();render();const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([doc()],{type:'text/html'}));l.download='index.html';l.click();toast('File index.html diunduh')}
  else if(a==='popx')popX();
  else if(a==='popgo')popGo();
  else if(a==='pops'){if(editing)capture();W={on:!!S.popOn,list:(S.pops||[]).map(p=>({...p}))};drawOps()}
  else if(a==='oadd'){syncO();W.list.push(newPop());drawOps()}
  else if(a==='oimg'){syncO();pick(900,u=>{W.list[i].img=u;drawOps()})}
  else if(a==='oimx'){syncO();W.list[i].img='';drawOps()}
  else if(a==='odel'){syncO();W.list.splice(i,1);drawOps()}
  else if(a==='oprev'){syncO();popOpen(W.list[i])}
  else if(a==='osave'){syncO();S.popOn=W.on;S.pops=W.list;await commit()}
  else if(a==='tgr'){if(editing)capture();S.rvOn=!S.rvOn;await persist();render();toast('Ulasan Google '+(S.rvOn?'ditampilkan di Beranda':'disembunyikan'))}
  else if(a==='tgp'){if(editing)capture();S.popOn=!S.popOn;await persist();render();toast('Popup promo '+(S.popOn?'diaktifkan':'dimatikan'))}
  else if(a==='out'){me=null;editing=false;try{sessionStorage.removeItem('me')}catch(e){}render()}
  else if(a==='edit'){if(editing){capture();editing=false;await commit()}else{editing=true;render()}}
  else if(a==='addtext'){$('#content').insertAdjacentHTML('beforeend',"<section><h2>Judul baru</h2><p>Tulis isi di sini…</p></section>");dec()}
  else if(a==='addgrid'){$('#content').insertAdjacentHTML('beforeend',"<section><h2>Judul baru</h2><div class='grid'>"+"<div class='card'><h3>Judul</h3><p>Deskripsi</p></div>".repeat(3)+"</div></section>");dec()}
  else if(a==='addcard'){const g=[...$('#content').querySelectorAll('.grid')].pop();if(g){g.insertAdjacentHTML('beforeend',"<div class='card'><h3>Judul</h3><p>Deskripsi</p></div>");dec()}else toast('Belum ada grid, klik + Grid dulu')}
  else if(a==='pages'){if(editing)capture();W=S.pages.map(p=>({...p}));drawPages()}
  else if(a==='pdel'){syncP();if(W.length>1){W.splice(i,1);drawPages()}}
  else if(a==='padd'){syncP();const n=$('#np').value.trim();if(n){W.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,5),title:n,html:`<section><h2>${esc(n)}</h2><p>Tulis isi halaman di sini.</p></section>`});drawPages()}}
  else if(a==='psave'){syncP();S.pages=W;await commit()}
  else if(a==='look')modal(`<h3>Tampilan</h3><label>Nama brand</label><input id="br" value="${esc(S.brand)}"><label>Latar belakang</label><div class="row">${PRE.map((p,k)=>`<div class="sw" title="${p[0]}" data-a="pre" data-i="${k}" style="background:${p[1]}"></div>`).join('')}</div><div class="row"><input id="c1" type="color" value="#e9f2f1"><input id="c2" type="color" value="#f8f6f1"><button class="btn ghost sm" data-a="cust">Pakai warna ini</button></div><div class="row"><button class="btn ghost sm" data-a="bgfoto">Tempel foto latar</button><button class="btn ghost sm" data-a="bgrm">Hapus foto</button></div><label>Ketebalan overlay putih di atas foto</label><input id="ov" type="range" min="0" max="0.95" step="0.05" value="${S.ov??.6}"><label>Nomor WhatsApp (08xx atau 628xx)</label><input id="wa" type="tel" inputmode="tel" placeholder="08123456789" value="${esc(S.wa||'')}"><label>Pesan otomatis saat chat dibuka</label><input id="wam" value="${esc(S.wam??'Halo, saya ingin konsultasi pajak.')}"><label>Tampilkan / sembunyikan bagian</label><label class="ck"><input type="checkbox" id="tgt" ${S.topOn?'checked':''}> Bar pengumuman di paling atas</label><input id="tp" value="${esc(S.top||'')}" placeholder="Teks bar atas"><label class="ck"><input type="checkbox" id="tgr" ${S.rvOn?'checked':''}> Ulasan Google</label><label class="ck"><input type="checkbox" id="tgp" ${S.popOn?'checked':''}> Popup promo untuk pengunjung</label><label>Link Instagram</label><input id="ig" type="url" placeholder="https://instagram.com/akunanda" value="${esc(S.ig||'')}"><label>Link LinkedIn</label><input id="li" type="url" placeholder="https://linkedin.com/company/..." value="${esc(S.li||'')}"><label>Warna utama</label><input id="ac" type="color" value="${S.ac||'#0e4d64'}"><p></p><button class="btn" data-a="lsave">Simpan</button> <button class="btn ghost" data-a="close">Tutup</button>`);
  else if(a==='bgfoto')pick(1920,u=>{S.img=u;css()});
  else if(a==='bgrm'){S.img='';css()}
  else if(a==='addimg')pick(1400,u=>{$('#content').insertAdjacentHTML('beforeend',`<section><img class="ph" alt="" src="${u}"></section>`);dec()});
  else if(a==='pre'){S.bg=PRE[i][1];css()}
  else if(a==='cust'){S.bg=`linear-gradient(160deg,${$('#c1').value},${$('#c2').value})`;css()}
  else if(a==='lsave'){S.brand=$('#br').value.trim()||S.brand;S.ac=$('#ac').value;S.wa=$('#wa').value.trim();S.ig=$('#ig').value.trim();S.topOn=$('#tgt').checked;S.top=$('#tp').value.trim();S.rvOn=$('#tgr').checked;S.popOn=$('#tgp').checked;S.li=$('#li').value.trim();S.wam=$('#wam').value;await commit()}
  else if(a==='login')authM('l');
  else if(a==='atab')authM(t.dataset.t);
  else if(a==='aj'){aj=t.dataset.j;document.querySelectorAll('.ch').forEach(c=>c.classList.toggle('on',c.dataset.j===aj))}
  else if(a==='dologin'){const nm=$('#lu').value.trim(),u=S.users.find(x=>x.u.toLowerCase()===nm.toLowerCase()&&x.role===aj);if(u&&u.h===await sha($('#lp').value)){me=u.u;try{sessionStorage.setItem('me',me)}catch(e){}render()}else $('#le').textContent='Nama, jabatan, atau password tidak cocok.'}
  else if(a==='doreg'){const nm=$('#lu').value.trim(),pw=$('#lp').value;if(nm.length<2)return $('#le').textContent='Isi nama lengkap.';if(pw.length<6)return $('#le').textContent='Password minimal 6 karakter.';if(S.users.some(x=>x.u.toLowerCase()===nm.toLowerCase()))return $('#le').textContent='Nama itu sudah terdaftar.';const code=btoa(unescape(encodeURIComponent(JSON.stringify({n:nm,j:aj,h:await sha(pw)}))));const msg='Permintaan akses admin website\nNama: '+nm+'\nJabatan: '+rl(aj)+'\nKode: '+code;modal(`<h3>Permintaan siap dikirim</h3><p class="inf">Kirim kode ini ke admin untuk disetujui. Password Anda tidak ikut terkirim, hanya sidik digitalnya.</p><textarea id="rcode" readonly>${code}</textarea><div class="row"><button class="btn sm" data-a="rqcp">Salin kode</button>${wan()?`<a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/${wan()}?text=${encodeURIComponent(msg)}">Kirim via WhatsApp</a>`:''}</div><p></p><button class="btn ghost" data-a="close">Tutup</button>`)}
  else if(a==='rqcp'){try{await navigator.clipboard.writeText($('#rcode').value);toast('Kode disalin')}catch(e){$('#rcode').select()}}
  else if(a==='users'){if(!me)return;RQ=(S.reqs||[]).map(r=>({...r}));W=S.users.map(u=>({...u,o:u.u}));drawUsers()}
  else if(a==='udel'){syncU();W.splice(i,1);drawUsers()}
  else if(a==='rqadd'){syncU();try{const r=JSON.parse(decodeURIComponent(escape(atob($('#rq').value.trim()))));if(!r.n||!/^[0-9a-f]{64}$/.test(r.h||'')||!['admin','manajer','staf'].includes(r.j))throw 0;if(RQ.some(x=>x.n.toLowerCase()===r.n.toLowerCase())||W.some(x=>x.u.toLowerCase()===r.n.toLowerCase()))return $('#ue').textContent='Nama itu sudah ada di daftar atau antrian.';RQ.push({n:String(r.n).slice(0,60),j:r.j,h:r.h});drawUsers()}catch(err){$('#ue').textContent='Kode permintaan tidak valid.'}}
  else if(a==='rqok'){syncU();const r=RQ.splice(i,1)[0];W.push({u:r.n,h:r.h,role:r.j});drawUsers()}
  else if(a==='rqno'){syncU();RQ.splice(i,1);drawUsers()}
  else if(a==='usave'){syncU();const nu=$('#nu').value.trim(),np=$('#npw').value;
    if(nu){if(!np)return $('#ue').textContent='Isi password untuk akun baru.';if(W.find(u=>u.u.toLowerCase()===nu.toLowerCase()))return $('#ue').textContent='Nama sudah terdaftar.';W.push({u:nu,pw:np,role:$('#nr').value})}
    if(W.some(u=>u.u.length<2))return $('#ue').textContent='Nama minimal 2 karakter.';
    if(new Set(W.map(u=>u.u.toLowerCase())).size!==W.length)return $('#ue').textContent='Ada dua akun dengan nama yang sama.';
    if(W.some(u=>u.pw&&u.pw.length<6))return $('#ue').textContent='Password baru minimal 6 karakter.';
    if(!W.some(u=>u.role==='admin'))return $('#ue').textContent='Harus ada minimal satu admin.';
    for(const u of W){if(u.pw){u.h=await sha(u.pw);delete u.pw}}
    const cu=W.find(u=>u.o===me);if(cu){me=cu.u;try{sessionStorage.setItem('me',me)}catch(e){}}
    W.forEach(u=>delete u.o);S.users=W;S.reqs=RQ;await commit()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp'){const b=document.querySelector('[data-a=dologin],[data-a=doreg]');b&&b.click()}});
let busy=false;
async function nav(id){
  if(busy)return;
  if(id===cur){document.body.classList.remove('mo');scrollTo(0,0);return}
  busy=true;
  try{
    if(editing)capture();
    const c=$('#content'),b=$('#pb');
    b.style.opacity=1;b.style.width='65%';c&&c.classList.add('out');
    await new Promise(r=>setTimeout(r,240));
    cur=id||S.pages[0].id;render(true);scrollTo(0,0);
    b.style.width='100%';setTimeout(()=>{b.style.opacity=0;setTimeout(()=>b.style.width='0',300)},250);
  }catch(err){cur=id;try{render(true)}catch(e2){}}
  busy=false;
}
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id==='login'){openLogin();clrHash();return}if(id&&id!==cur)nav(id)});
addEventListener('scroll',()=>{const n=$('.nav');n&&n.classList.toggle('sc',scrollY>8)},{passive:true});
document.addEventListener('input',e=>{if(e.target.id==='ov'){S.ov=+e.target.value;css()}});
document.addEventListener('change',e=>{if(e.target.dataset.k==='theme'){const r=e.target.closest('.pr'),v=PT[e.target.value];['c1','c2','ca','cb','cd'].forEach((k,j)=>{r.querySelector('[data-k="'+k+'"]').value=v[j]})}});
render();popSched();if(location.hash==='#login'){openLogin();clrHash()}
</script>
</body></html>
